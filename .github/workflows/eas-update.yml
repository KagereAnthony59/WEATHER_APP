name: Automatic EAS OTA Update

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: Publish EAS Update to Cloud
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout Repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 Verify Expo Authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is empty or missing in GitHub Secrets!"
            exit 1
          fi
          echo "Token found. Verifying login with EAS..."
          npx --yes eas-cli whoami

      - name: 🚀 Publish EAS Update Automatically
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: npx --yes eas-cli update --branch main --message "${COMMIT_MSG:-Auto OTA update from GitHub Actions}" --non-interactive
